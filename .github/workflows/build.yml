name: Build & Release

on:
  push:
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      LICENSE_SECRET_KEY: ${{ secrets.LICENSE_SECRET_KEY }}
      TRIAL_LICENSE_KEY: ${{ secrets.TRIAL_LICENSE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Create Installer
        run: iscc installer.iss

      - name: Generate SHA-256 Checksum
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path installer_output -Filter *.exe
          foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            Write-Output "sha256:$hash"
            Set-Content -Path "installer_output/$($f.BaseName).sha256" -Value "sha256:$hash"
          }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/*.exe
            installer_output/*.sha256
          generate_release_notes: true
